[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prepress-preflight"
version = "0.1.0"
description = "Read-only command-line preflight checker for print PDFs"
requires-python = ">=3.10"
dependencies = ["pikepdf>=8", "pymupdf>=1.24", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
preflight = "prepress_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prepress_preflight = ["app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
